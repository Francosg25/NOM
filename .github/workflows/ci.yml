name: Verificar NOM Monitor
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: nom-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: python -m pytest -q --cov=app --cov-report=xml:data/coverage.xml
        working-directory: backend
      - run: python -m app.cli init-db
        working-directory: backend
      - run: python -m alembic check
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: backend/data/coverage.xml
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: python -m ruff check app
        working-directory: backend
      - run: python -m ruff format --check app
        working-directory: backend
      - run: python -m bandit -r app -ll -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r backend/requirements.txt
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: bash scripts/package-appservice.sh
        working-directory: .
      - run: python scripts/package_smoke.py data/nom-appservice.zip
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
  postgres:
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_DB: nom_ci
          POSTGRES_USER: nom_ci
          POSTGRES_PASSWORD: nom_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nom_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://nom_ci:nom_ci@localhost:5432/nom_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m app.cli init-db
      - run: python -m alembic check
      - run: python ci_postgres.py
